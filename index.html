```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CinePulse - Movie Reviews</title>

<style>
:root{
    --red:#e50914;
    --black:#050505;
    --bg:#0b0b0b;
    --card:#151515;
    --border:#292929;
    --text:#fff;
    --muted:#999;
    --gold:#f5c518;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:white;
    font-family:Arial,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#050505ee;
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:16px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:900;
    color:var(--red);
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:#ccc;
    text-decoration:none;
    font-size:14px;
}

.hero{
    min-height:550px;
    display:flex;
    align-items:center;
    padding:60px 7%;
    background:
    linear-gradient(90deg,#000 0%,#000b 50%,#0003),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1900&q=85");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:65px;
    margin-bottom:20px;
}

.hero h1 span{
    color:var(--red);
}

.hero p{
    max-width:600px;
    color:#ccc;
    line-height:1.7;
    margin-bottom:25px;
}

.btn{
    border:0;
    padding:13px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.red{
    background:var(--red);
    color:white;
}

.search{
    padding:25px 7%;
    background:#111;
}

.search input{
    width:100%;
    padding:15px;
    background:#191919;
    border:1px solid #333;
    border-radius:7px;
    color:white;
    outline:none;
}

section{
    padding:60px 7%;
}

.title{
    text-align:center;
    margin-bottom:35px;
    font-size:35px;
}

.title span{
    color:var(--red);
}

.filters{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.filters button{
    padding:10px 18px;
    border:1px solid #333;
    background:#181818;
    color:#aaa;
    border-radius:20px;
    cursor:pointer;
}

.filters button.active{
    background:var(--red);
    color:white;
    border-color:var(--red);
}

.movie-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));
    gap:22px;
}

.movie-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
    transition:.25s;
}

.movie-card:hover{
    transform:translateY(-6px);
    border-color:var(--red);
}

.poster{
    width:100%;
    height:280px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-poster{
    font-size:50px;
}

.info{
    padding:15px;
}

.info h3{
    font-size:17px;
    margin-bottom:7px;
}

.meta{
    color:#888;
    font-size:12px;
    margin-bottom:10px;
}

.rating{
    color:var(--gold);
    margin-bottom:12px;
}

.buttons{
    display:flex;
    gap:7px;
}

.buttons button{
    flex:1;
    padding:9px 5px;
    border:0;
    border-radius:5px;
    cursor:pointer;
}

.watch{
    background:#292929;
    color:white;
}

.review{
    background:var(--red);
    color:white;
}

#watchlist{
    background:#101010;
}

.watch-box{
    max-width:800px;
    margin:auto;
    background:#151515;
    padding:25px;
    border:1px solid #292929;
    border-radius:9px;
}

.watch-item{
    display:flex;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #292929;
}

.remove{
    background:#292929;
    color:white;
    border:0;
    padding:7px 12px;
    border-radius:5px;
}

.review-box{
    max-width:700px;
    margin:auto;
    background:#151515;
    padding:25px;
    border-radius:9px;
}

.review-box input,
.review-box textarea{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    background:#090909;
    border:1px solid #333;
    color:white;
    border-radius:5px;
}

.review-box textarea{
    min-height:120px;
}

footer{
    text-align:center;
    padding:45px;
    background:#050505;
    color:#777;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h1{
        font-size:43px;
    }

    section{
        padding:45px 5%;
    }

    .movie-grid{
        grid-template-columns:
        repeat(2,1fr);
        gap:12px;
    }

    .poster{
        height:250px;
    }
}
</style>
</head>

    <div class="logo">🎬 CINEPULSE</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#movies">Movies</a>

        <a href="#reviews">Reviews</a>
    </nav>

</header>

    <div>

        <h1>
            Feel Every <span>Frame.</span>

        <button

            Explore Movies
        </button>

<div class="search">

    <input
        id="search"

    <div class="filters">

            All
        </button>

            onclick="filterMovies('Malayalam',this)">
            Malayalam
        </button>

        <button
            onclick="filterMovies('Tamil',this)">
            Tamil
        </button>

    </div>

    <div
        class="movie-grid"
        id="movieGrid">
    </div>

</section>

    <h2 class="
